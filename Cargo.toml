[package]
name = "rc-tui"
version = "0.2.1"
edition = "2024"
rust-version = "1.88"
description = "RevenueCat overview in the terminal, with animated metric cards"
license = "GPL-3.0"
repository = "https://github.com/guitaripod/rc-tui"
keywords = ["revenuecat", "tui", "terminal", "dashboard", "ratatui"]
categories = ["command-line-utilities"]

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4.6", features = ["derive", "env"] }
color-eyre = "0.6"
libc = "0.2"
ratatui = "0.30"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "gzip", "http2", "charset", "query"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tachyonfx = "0.25"
tokio = { version = "1", features = ["rt", "time", "net", "sync", "io-util", "macros"] }
toml = "1.1.8"
unicode-width = "0.2"
